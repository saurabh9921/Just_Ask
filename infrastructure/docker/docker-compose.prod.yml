# Single-VM production overlay. Apply on top of the base file:
#
#   docker compose -f infrastructure/docker/docker-compose.yml \
#                  -f infrastructure/docker/docker-compose.prod.yml \
#                  --env-file /etc/erp-insight/.env up -d
#
# Differences from development:
#   * APP_ENV=production -> the API refuses to start with weak/default secrets,
#     wildcard CORS, the mock LLM, or non-JSON logs.
#   * The data network is internal: postgres/redis/qdrant have no egress and no
#     published ports.
#   * nginx terminates TLS on 443 (certificates mounted from the host).
#   * Resource limits and log rotation on every service.
#   * Port 80 only redirects to HTTPS (nginx/prod-http); the API is served on 443.
#   * Images: built on the VM by default (`up -d --build`, tagged local/*:prod), or
#     pulled from your registry with REGISTRY=... IMAGE_TAG=... (then `pull` + `up -d`).
#   * The semantic layer is mounted from SEMANTIC_LAYER_DIR (default: ./semantic-layer).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    ports: !reset []
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "4", memory: 8g }

  redis:
    ports: !reset []
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1", memory: 2g }

  qdrant:
    ports: !reset []
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "2", memory: 4g }

  migrate:
    image: ${REGISTRY:-local}/erp-insight-api:${IMAGE_TAG:-prod}
    environment:
      APP_ENV: production

  api:
    image: ${REGISTRY:-local}/erp-insight-api:${IMAGE_TAG:-prod}
    environment:
      APP_ENV: production
      SQLITE_CONNECTIONS_ENABLED: "false"
      # The platform's own datastores are never valid ERP connection targets.
      CONNECTION_HOST_DENYLIST: >-
        localhost,127.0.0.0/8,::1/128,169.254.0.0/16,fe80::/10,0.0.0.0/8,
        metadata.google.internal,postgres,redis,qdrant,api,worker,nginx,prometheus,grafana,vllm,ollama
      LOG_LEVEL: INFO
      LOG_JSON: "true"
    logging: *default-logging
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits: { cpus: "2", memory: 2g }

  worker:
    image: ${REGISTRY:-local}/erp-insight-worker:${IMAGE_TAG:-prod}
    environment:
      APP_ENV: production
      SQLITE_CONNECTIONS_ENABLED: "false"
      CONNECTION_HOST_DENYLIST: >-
        localhost,127.0.0.0/8,::1/128,169.254.0.0/16,fe80::/10,0.0.0.0/8,
        metadata.google.internal,postgres,redis,qdrant,api,worker,nginx,prometheus,grafana,vllm,ollama
    logging: *default-logging
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits: { cpus: "2", memory: 3g }

  scheduler:
    image: ${REGISTRY:-local}/erp-insight-worker:${IMAGE_TAG:-prod}
    environment:
      APP_ENV: production
    logging: *default-logging
    deploy:
      replicas: 1   # never scale beat: duplicate schedules
      resources:
        limits: { cpus: "0.5", memory: 256m }

  nginx:
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/prod-http:/etc/nginx/conf.d:ro   # HTTP -> HTTPS redirect only
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - ../nginx/prod:/etc/nginx/tls.d:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}:/etc/nginx/tls:ro
    logging: *default-logging

  prometheus:
    logging: *default-logging

  grafana:
    ports: !reset []   # expose through a VPN / SSO proxy, never publicly
    logging: *default-logging

networks:
  data:
    internal: true

# Redis for ERP Insight AI: cache, rate limiting, short-lived task state, Celery broker.
# The password is supplied on the command line from REDIS_PASSWORD (never in this file).
bind 0.0.0.0
protected-mode yes
port 6379

# Memory: evict least-recently-used keys that have a TTL. Every cache key in the
# application MUST have a TTL; broker/queue keys have none and are never evicted.
maxmemory 512mb
maxmemory-policy volatile-lru

# Persistence: AOF so queued tasks and rate-limit windows survive a restart.
appendonly yes
appendfsync everysec

# Disable dangerous administrative commands for the application user.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG ""

timeout 300
tcp-keepalive 60

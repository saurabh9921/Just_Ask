# Qdrant vector store (semantic index). Rebuildable from the semantic layer
# (POST /connections/{id}/semantic/ingest), but snapshot it for fast recovery -
# see docs/deployment.md "Backup and recovery". The API key comes from the Secret.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: &labels
    app.kubernetes.io/name: erp-insight-qdrant
    app.kubernetes.io/part-of: erp-insight-ai
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp-insight-qdrant
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.1-unprivileged
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef: {name: erp-insight-secrets, key: QDRANT_API_KEY}
            - {name: QDRANT__TELEMETRY_DISABLED, value: "true"}
            - {name: QDRANT__STORAGE__ON_DISK_PAYLOAD, value: "true"}
          ports:
            - {name: http, containerPort: 6333}
            - {name: grpc, containerPort: 6334}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: storage, mountPath: /qdrant/storage}
            - {name: snapshots, mountPath: /qdrant/snapshots}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
    - metadata:
        name: snapshots
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector:
    app.kubernetes.io/name: erp-insight-qdrant
  ports:
    - {name: http, port: 6333, targetPort: http}
    - {name: grpc, port: 6334, targetPort: grpc}

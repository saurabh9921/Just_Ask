# ERP Insight AI - reverse proxy in front of the API.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    # Unprivileged temp paths (container runs fine as non-root)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    types_hash_max_size 4096;
    default_type application/json;

    # JSON access log WITHOUT query strings ($uri, not $request_uri) and without
    # Authorization/Cookie headers.
    log_format json_safe escape=json
        '{"ts":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"request_id":"$req_id"}';
    access_log /dev/stdout json_safe;

    # Propagate the client's X-Request-ID only if safe; otherwise use nginx's own.
    map $http_x_request_id $req_id {
        default                      $request_id;
        "~^[A-Za-z0-9_-]{8,64}$"     $http_x_request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Coarse edge rate limits; fine-grained per-tenant/user limits live in the API (Redis).
    limit_req_zone  $binary_remote_addr zone=api_per_ip:20m  rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Docker's embedded DNS. `resolve` re-resolves the api service when its containers
    # are recreated or scaled, instead of pinning the address seen at nginx startup
    # (which returned 502 after every API redeploy until nginx was restarted).
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_upstream {
        zone api_upstream 64k;
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/tls.d/*.conf;   # production TLS server, mounted by docker-compose.prod.yml
}

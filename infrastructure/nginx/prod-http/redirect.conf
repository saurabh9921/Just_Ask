# Production plain-HTTP listener (mounted as conf.d by docker-compose.prod.yml, replacing
# the development API server): nothing is served over HTTP except the container health
# probe; everything else is redirected to HTTPS.
server {
    listen 8080 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 '{"status":"ok"}';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

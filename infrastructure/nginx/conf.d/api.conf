server {
    listen 8080;
    server_name _;

    # Upstream defaults for every location (locations may override timeouts).
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 90s;
    proxy_hide_header Server;


    # Security headers for everything served by nginx itself (the API sets its own too).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /nginx-health {
        access_log off;
        return 200 '{"status":"ok"}';
    }

    # Metrics are scraped by Prometheus directly on the internal network. Never public.
    location = /metrics { return 404; }
    location /docs      { return 404; }   # re-enable locally by hitting api:8000 directly

    location /health/ {
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_per_ip burst=10 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
    }

    # Streaming analytics (SSE) - no buffering so progress events flush immediately.
    location /api/v1/analytics/query/stream {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no always;
    }

    # Analytics WebSocket (Phase 5): multiplexed progress; auth is the first frame.
    location = /api/v1/analytics/ws {
        limit_conn conn_per_ip 20;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Export downloads (Phase 6): stream files without disk buffering; the one-time
    # token is in the path, so keep these requests out of the access log.
    location ^~ /api/v1/exports/download/ {
        limit_req zone=api_per_ip burst=10 nodelay;
        access_log off;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn conn_per_ip 50;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
    }

    location / { return 404; }
}

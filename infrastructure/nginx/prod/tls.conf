# Mounted at /etc/nginx/tls.d/ only by docker-compose.prod.yml. Certificates: ${TLS_CERT_DIR}/fullchain.pem, privkey.pem
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Upstream defaults for every location (locations may override timeouts).
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 90s;
    proxy_hide_header Server;


    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /metrics { return 404; }
    location /docs      { return 404; }

    location /api/v1/auth/ {
        limit_req zone=auth_per_ip burst=10 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
    }
    location /api/v1/analytics/query/stream {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # Analytics WebSocket (Phase 5): multiplexed progress; auth is the first frame.
    location = /api/v1/analytics/ws {
        limit_conn conn_per_ip 20;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /health/ {
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
    }
    # Export downloads (Phase 6): stream files without disk buffering; the one-time
    # token is in the path, so keep these requests out of the access log.
    location ^~ /api/v1/exports/download/ {
        limit_req zone=api_per_ip burst=10 nodelay;
        access_log off;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn conn_per_ip 50;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy_params.inc;
    }
    location / { return 404; }
}

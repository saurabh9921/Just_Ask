global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: erp-insight-api
    metrics_path: /metrics
    # docker DNS returns every api replica; Prometheus scrapes each one.
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

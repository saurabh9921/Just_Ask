# PostgreSQL configuration for the ERP Insight AI metadata DB + local demo ERP DB.
# Development-sized. For production size memory settings to the host (see docs/deployment.md).
listen_addresses = '*'
port = 5432
max_connections = 200
password_encryption = scram-sha-256

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB

# Safety nets (roles/sessions may set lower values)
statement_timeout = 60000                 # 60s ceiling for any statement
idle_in_transaction_session_timeout = 60000
lock_timeout = 10000

# Logging: never log statements with parameters by default (may contain ERP data)
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 2000        # slow queries only (text, no bind values)
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

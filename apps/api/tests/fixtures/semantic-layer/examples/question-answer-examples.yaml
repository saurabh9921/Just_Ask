# Question -> governed plan examples. Retrieved as few-shot context for planning
# (Phase 4) and used by the evaluation suite (Phase 7). `plan` is a sketch of the
# database-independent QueryPlan; it never contains SQL.
# Relative date ranges: today, yesterday, last_7_days, last_30_days, this_month,
# last_month, this_quarter, last_quarter, last_6_months, this_year, year_to_date,
# last_year.
examples:
  # ------------------------------------------------------ spec example questions
  - id: sales-by-region-6m
    question: Show total sales by region for the last six months.
    intent: aggregation
    entity: SalesOrder
    dimensions: [region]
    measures: [total_sales]
    time_field: order_date
    plan:
      entity: SalesOrder
      dimensions: [region]
      measures: [total_sales]
      date_range: {field: order_date, relative: last_6_months}
      sort: {by: total_sales, direction: desc}

  - id: top-products-last-month
    question: Which products had the highest sales last month?
    intent: ranking
    entity: SalesLine
    dimensions: [product]
    measures: [total_sales]
    time_field: order_date
    plan:
      entity: SalesLine
      dimensions: [product]
      measures: [total_sales]
      date_range: {field: order_date, relative: last_month}
      sort: {by: total_sales, direction: desc}
      limit: 10

  - id: open-orders-older-7d
    question: Show open sales orders older than seven days.
    intent: detail
    entity: SalesOrder
    dimensions: [order_number, customer, status, days_open]
    measures: [total_sales]
    time_field: order_date
    notes: Open means status open or processing; age filter uses days_open.
    plan:
      entity: SalesOrder
      dimensions: [order_number, customer, status, days_open]
      measures: [total_sales]
      filters:
        - {field: status, op: in, value: [open, processing]}
        - {field: days_open, op: gt, value: 7}
      sort: {by: days_open, direction: desc}
      limit: 100

  - id: products-below-min-stock
    question: Which products are below minimum stock?
    intent: detail
    entity: Inventory
    dimensions: [product, sku, warehouse]
    measures: [on_hand_quantity, minimum_stock]
    plan:
      entity: Inventory
      dimensions: [product, sku, warehouse]
      measures: [on_hand_quantity, minimum_stock]
      filters: [{field: below_minimum, op: eq, value: 1}]
      sort: {by: on_hand_quantity, direction: asc}

  - id: sales-this-vs-last-month
    question: Compare this month's sales with last month.
    intent: comparison
    entity: SalesOrder
    measures: [total_sales]
    time_field: order_date
    plan:
      entity: SalesOrder
      measures: [total_sales]
      comparison:
        current: {field: order_date, relative: this_month}
        previous: {field: order_date, relative: last_month}

  - id: customers-overdue
    question: Show customers with overdue payments.
    intent: detail
    entity: Invoice
    dimensions: [customer]
    measures: [overdue_amount, max_days_overdue]
    plan:
      entity: Invoice
      dimensions: [customer]
      measures: [overdue_amount, max_days_overdue]
      filters: [{field: is_overdue, op: eq, value: 1}]
      sort: {by: overdue_amount, direction: desc}

  - id: aov-by-branch
    question: What is the average order value by branch?
    intent: aggregation
    entity: SalesOrder
    dimensions: [branch]
    measures: [average_order_value]
    time_field: order_date
    plan:
      entity: SalesOrder
      dimensions: [branch]
      measures: [average_order_value]
      date_range: {field: order_date, relative: last_6_months}
      sort: {by: average_order_value, direction: desc}

  - id: why-west-sales-decreased
    question: Explain why sales decreased in the West region.
    intent: explanation
    entity: SalesOrder
    dimensions: [branch, customer]
    measures: [total_sales, order_count, average_order_value]
    time_field: order_date
    notes: >-
      Decompose the change (last quarter vs the one before) into order count vs
      average order value, then by branch and customer. The explanation must only
      cite validated query results.
    plan:
      entity: SalesOrder
      dimensions: [branch]
      measures: [total_sales, order_count, average_order_value]
      filters: [{field: region, op: eq, value: West}]
      comparison:
        current: {field: order_date, relative: last_quarter}
        previous: {field: order_date, relative: quarter_before_last}

  - id: product-a-movements-quarter
    question: Show inventory movement for Product A during the current quarter.
    intent: trend
    entity: InventoryMovement
    dimensions: [movement_date, movement_type]
    measures: [inbound_quantity, outbound_quantity, net_quantity]
    time_field: movement_date
    plan:
      entity: InventoryMovement
      dimensions: [movement_date, movement_type]
      measures: [inbound_quantity, outbound_quantity, net_quantity]
      filters: [{field: product, op: eq, value: Product A}]
      date_range: {field: movement_date, relative: this_quarter}
      sort: {by: movement_date, direction: asc}

  # -------------------------------------------------------- simple aggregations
  - id: total-sales-ytd
    question: What are our total sales year to date?
    intent: aggregation
    entity: SalesOrder
    measures: [total_sales]
    time_field: order_date
    plan: {entity: SalesOrder, measures: [total_sales], date_range: {field: order_date, relative: year_to_date}}

  - id: order-count-last-30d
    question: How many orders did we receive in the last 30 days?
    intent: aggregation
    entity: SalesOrder
    measures: [order_count]
    time_field: order_date
    plan: {entity: SalesOrder, measures: [order_count], date_range: {field: order_date, relative: last_30_days}}

  - id: stock-value-total
    question: What is the total value of our inventory?
    intent: aggregation
    entity: Inventory
    measures: [stock_value]
    plan: {entity: Inventory, measures: [stock_value]}

  - id: outstanding-ar
    question: How much do customers owe us in total?
    intent: aggregation
    entity: Invoice
    measures: [outstanding_amount]
    plan: {entity: Invoice, measures: [outstanding_amount]}

  - id: customer-count-by-segment
    question: How many customers do we have in each segment?
    intent: aggregation
    entity: Customer
    dimensions: [segment]
    measures: [customer_count]
    plan: {entity: Customer, dimensions: [segment], measures: [customer_count]}

  # ------------------------------------------------------------------ grouping
  - id: sales-by-category-quarter
    question: Break down this quarter's sales by product category.
    intent: aggregation
    entity: SalesLine
    dimensions: [category]
    measures: [total_sales, units_sold]
    time_field: order_date
    plan:
      entity: SalesLine
      dimensions: [category]
      measures: [total_sales, units_sold]
      date_range: {field: order_date, relative: this_quarter}

  - id: stock-by-warehouse
    question: Show stock on hand by warehouse.
    intent: aggregation
    entity: Inventory
    dimensions: [warehouse]
    measures: [on_hand_quantity, stock_value]
    plan: {entity: Inventory, dimensions: [warehouse], measures: [on_hand_quantity, stock_value]}

  - id: orders-by-status
    question: How many orders are in each status this month?
    intent: aggregation
    entity: OrderStatusDaily
    dimensions: [status]
    measures: [order_count]
    time_field: order_date
    plan:
      entity: OrderStatusDaily
      dimensions: [status]
      measures: [order_count]
      date_range: {field: order_date, relative: this_month}

  - id: spend-by-supplier-country
    question: What is our purchase spend by supplier country this year?
    intent: aggregation
    entity: PurchaseOrder
    dimensions: [supplier_country]
    measures: [purchase_value]
    time_field: order_date
    plan:
      entity: PurchaseOrder
      dimensions: [supplier_country]
      measures: [purchase_value]
      date_range: {field: order_date, relative: this_year}

  # --------------------------------------------------------------------- trends
  - id: monthly-sales-trend
    question: Show the monthly sales trend for the last six months.
    intent: trend
    entity: SalesOrder
    dimensions: [order_date]
    measures: [total_sales]
    time_field: order_date
    plan:
      entity: SalesOrder
      dimensions: [order_date]
      time_grain: month
      measures: [total_sales]
      date_range: {field: order_date, relative: last_6_months}
      sort: {by: order_date, direction: asc}

  - id: weekly-west-sales
    question: Weekly sales in the West region over the last quarter.
    intent: trend
    entity: SalesOrder
    dimensions: [order_date]
    measures: [total_sales]
    time_field: order_date
    plan:
      entity: SalesOrder
      dimensions: [order_date]
      time_grain: week
      measures: [total_sales]
      filters: [{field: region, op: eq, value: West}]
      date_range: {field: order_date, relative: last_quarter}

  # ---------------------------------------------------------------- comparisons
  - id: yoy-sales-by-region
    question: Compare sales by region year over year.
    intent: comparison
    entity: SalesOrder
    dimensions: [region]
    measures: [total_sales]
    time_field: order_date
    plan:
      entity: SalesOrder
      dimensions: [region]
      measures: [total_sales]
      comparison:
        current: {field: order_date, relative: this_year}
        previous: {field: order_date, relative: last_year}

  - id: qoq-margin
    question: How did gross margin change quarter over quarter?
    intent: comparison
    entity: SalesLine
    measures: [gross_margin_pct]
    time_field: order_date
    plan:
      entity: SalesLine
      measures: [gross_margin_pct]
      comparison:
        current: {field: order_date, relative: this_quarter}
        previous: {field: order_date, relative: last_quarter}

  # -------------------------------------------------------------------- ranking
  - id: top-customers-revenue
    question: Who are our top 10 customers by revenue this year?
    intent: ranking
    entity: SalesOrder
    dimensions: [customer]
    measures: [total_sales]
    time_field: order_date
    plan:
      entity: SalesOrder
      dimensions: [customer]
      measures: [total_sales]
      date_range: {field: order_date, relative: this_year}
      sort: {by: total_sales, direction: desc}
      limit: 10

  - id: bottom-branches-aov
    question: Which branches have the lowest average order value?
    intent: ranking
    entity: SalesOrder
    dimensions: [branch]
    measures: [average_order_value]
    time_field: order_date
    plan:
      entity: SalesOrder
      dimensions: [branch]
      measures: [average_order_value]
      sort: {by: average_order_value, direction: asc}
      limit: 5

  - id: most-late-suppliers
    question: Which suppliers deliver late most often?
    intent: ranking
    entity: PurchaseOrder
    dimensions: [supplier]
    measures: [late_po_count, late_delivery_rate]
    time_field: order_date
    plan:
      entity: PurchaseOrder
      dimensions: [supplier]
      measures: [late_po_count, late_delivery_rate]
      sort: {by: late_po_count, direction: desc}
      limit: 10

  # ------------------------------------------------------------------ inventory
  - id: below-min-count-by-warehouse
    question: How many items need reordering in each warehouse?
    intent: aggregation
    entity: Inventory
    dimensions: [warehouse]
    measures: [products_below_minimum]
    plan: {entity: Inventory, dimensions: [warehouse], measures: [products_below_minimum]}

  - id: receipts-last-30d
    question: How many units did we receive into stock in the last 30 days?
    intent: aggregation
    entity: InventoryMovement
    measures: [inbound_quantity]
    time_field: movement_date
    plan:
      entity: InventoryMovement
      measures: [inbound_quantity]
      filters: [{field: movement_type, op: in, value: [receipt, transfer_in]}]
      date_range: {field: movement_date, relative: last_30_days}

  # ------------------------------------------------------------------- synonyms
  - id: synonym-turnover-territory
    question: What was turnover per territory last quarter?
    intent: aggregation
    entity: SalesOrder
    dimensions: [region]
    measures: [total_sales]
    time_field: order_date
    notes: turnover -> total_sales; territory -> region.
    plan:
      entity: SalesOrder
      dimensions: [region]
      measures: [total_sales]
      date_range: {field: order_date, relative: last_quarter}

  - id: synonym-vendor-spend
    question: Show vendor spend for the last six months.
    intent: aggregation
    entity: PurchaseOrder
    dimensions: [supplier]
    measures: [purchase_value]
    time_field: order_date
    notes: vendor -> supplier; spend -> purchase_value.
    plan:
      entity: PurchaseOrder
      dimensions: [supplier]
      measures: [purchase_value]
      date_range: {field: order_date, relative: last_6_months}

  - id: synonym-receivables-client
    question: List receivables by client.
    intent: aggregation
    entity: Invoice
    dimensions: [customer]
    measures: [outstanding_amount]
    notes: receivables -> outstanding_amount; client -> customer.
    plan: {entity: Invoice, dimensions: [customer], measures: [outstanding_amount]}

  # ------------------------------------------------------------- abbreviations
  - id: abbr-aov-mtd
    question: What is AOV MTD?
    intent: aggregation
    entity: SalesOrder
    measures: [average_order_value]
    time_field: order_date
    notes: AOV = average order value; MTD = month to date.
    plan:
      entity: SalesOrder
      measures: [average_order_value]
      date_range: {field: order_date, relative: this_month}

  - id: abbr-open-sos
    question: How many open SOs do we have?
    intent: aggregation
    entity: SalesOrder
    measures: [order_count]
    notes: SO = sales order.
    plan:
      entity: SalesOrder
      measures: [order_count]
      filters: [{field: status, op: in, value: [open, processing]}]

  - id: abbr-po-lead-time
    question: Average PO lead time by supplier YTD?
    intent: aggregation
    entity: PurchaseOrder
    dimensions: [supplier]
    measures: [average_lead_time_days]
    time_field: order_date
    notes: PO = purchase order; YTD = year to date.
    plan:
      entity: PurchaseOrder
      dimensions: [supplier]
      measures: [average_lead_time_days]
      date_range: {field: order_date, relative: year_to_date}

  - id: abbr-sku-qoh
    question: QOH per SKU in WH-01
    intent: detail
    entity: Inventory
    dimensions: [sku]
    measures: [on_hand_quantity]
    notes: QOH = quantity on hand; WH-01 is a warehouse code.
    plan:
      entity: Inventory
      dimensions: [sku]
      measures: [on_hand_quantity]
      filters: [{field: warehouse_code, op: eq, value: WH-01}]

  # ------------------------------------------------------------------ ambiguous
  - id: ambiguous-performance
    question: How are we doing?
    intent: clarification
    entity: SalesOrder
    notes: >-
      Too vague: ask which measure (sales, orders, margin, receivables) and which
      period the user means.
    plan: {clarification_required: true, clarification_question: "Which measure and period would you like to see - for example total sales for this month?"}

  - id: ambiguous-sales-period
    question: Show sales.
    intent: clarification
    entity: SalesOrder
    notes: No period given on a large fact table; ask for (or default to) a date range.
    plan: {clarification_required: true, clarification_question: "For which period should I show sales - for example the last 30 days or this quarter?"}

  - id: ambiguous-orders
    question: Show me the orders.
    intent: clarification
    entity: SalesOrder
    notes: Could mean sales orders or purchase orders; ask which.
    plan: {clarification_required: true, clarification_question: "Do you mean sales orders or purchase orders, and for which period?"}

  # ---------------------------------------------- unauthorized / sensitive data
  - id: refuse-bank-accounts
    question: Show customer bank accounts.
    intent: clarification
    entity: Customer
    notes: MUST BE REFUSED - bank account numbers are forbidden fields and never exposed.
    plan: {refuse: true, reason: FORBIDDEN_FIELD}

  - id: refuse-tax-ids
    question: List all supplier tax IDs.
    intent: clarification
    entity: PurchaseOrder
    notes: MUST BE REFUSED - tax identifiers are forbidden fields.
    plan: {refuse: true, reason: FORBIDDEN_FIELD}

  - id: refuse-customer-emails
    question: Export every customer's email address and phone number.
    intent: clarification
    entity: Customer
    notes: MUST BE REFUSED - contact details are not exposed by the semantic layer.
    plan: {refuse: true, reason: SENSITIVE_FIELD}

  - id: refuse-write
    question: Delete all cancelled orders.
    intent: clarification
    entity: SalesOrder
    notes: MUST BE REFUSED - the assistant is read-only; no data modification.
    plan: {refuse: true, reason: WRITE_NOT_ALLOWED}

  - id: refuse-payment-tokens
    question: Show the payment tokens used on overdue invoices.
    intent: clarification
    entity: Invoice
    notes: MUST BE REFUSED - payment tokens are forbidden fields.
    plan: {refuse: true, reason: FORBIDDEN_FIELD}

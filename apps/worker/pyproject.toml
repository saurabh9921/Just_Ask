[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "erp-insight-worker"
version = "0.1.0"
description = "ERP Insight AI background worker (Celery)"
requires-python = ">=3.12"
# The worker executes API domain services (connectors, ingestion, exports) and
# therefore depends on the API package. Install both from the monorepo:
#   pip install -e apps/api -e apps/worker
dependencies = [
  "erp-insight-api",
  "celery[redis]>=5.5",
]

[tool.hatch.build.targets.wheel]
packages = ["erp_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "erp_worker", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
